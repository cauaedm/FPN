educacao-em-tea-transtorno-do-espectro-autista:
  titulo: "Educação em TEA (Transtorno do Espectro Autista)"
  coordenador: "Monica Ferreira"
  area: "Educação"
  modalidade: "Curso"
  carga_horaria: 120
  descricao: >
    O curso visa proporcionar uma formação básica, tanto teórica quanto prática,
    para alunos e servidores no atendimento de indivíduos com Transtorno do Espectro
    Autista (TEA). Tem como objetivo fomentar reflexões e contribuir para a formação
    de profissionais, capacitando-os a avaliar e aprimorar suas práticas. Além disso,
    busca divulgar o conhecimento científico e práticas educacionais que promovam a
    melhoria da qualidade de vida das pessoas diagnosticadas com TEA.
  vagas: ~
  bolsa: ~
  processo_seletivo: ~
  perfil: ~
  contato: "extensao.tea@nce.ufrj.br"
  link_inscricao: "https://forms.gle/dW8w3pNwenoqgYSi6"
  ano_inicio: 2024

curso-de-linux-do-basico-a-administracao:
  titulo: "Curso de Linux: do Básico à Administração"
  coordenador: "Gabriel Pereira da Silva"
  area: "Tecnologia e Produção"
  modalidade: "Curso"
  carga_horaria: 60
  descricao: >
    O curso tem como objetivo que o aluno aprenda a trabalhar em sistemas Linux,
    tanto na parte de comandos básicos, shell script e tarefas básicas de administração,
    como criação de usuários, controle de processos, realização de backup, instalação
    de programas e configurações de serviços com DHCP, DNS, servidor de impressão,
    configuração da rede e de firewall. Elaborado para o ensino à distância, com aulas
    virtuais, exercícios online e listas de exercícios.
  vagas: ~
  bolsa: ~
  processo_seletivo: ~
  perfil: ~
  contato: "cursolinux@ic.ufrj.br"
  link_inscricao: "https://forms.gle/cYUWaGt5eS2nr5fs7"
  ano_inicio: 2024

olimpiadas-matematicas-universitarias:
  titulo: "Olimpíadas Matemáticas Universitárias"
  coordenador: "Gabriel Pereira da Silva"
  area: "Educação"
  modalidade: "Curso"
  carga_horaria: 180
  descricao: >
    Esta ação propõe a realização de um curso preparatório para Olimpíadas
    Matemáticas Universitárias com os seguintes conteúdos: Álgebra Linear,
    Cálculo, Geometria, Matemática Discreta, Teoria dos Números, Análise e
    Álgebra. Serão abordadas noções de matemática olímpica com conteúdos
    exigidos a um aluno do nível 3 das olimpíadas escolares.
  vagas: ~
  bolsa: ~
  processo_seletivo: ~
  perfil: ~
  contato: "romu@ic.ufrj.br"
  link_inscricao: "http://bit.ly/romu2023"
  ano_inicio: 2023

