# Projetos de Extensão do Instituto de Computação - UFRJ
#
# Campos obrigatórios (RF18):
#   titulo, coordenador, descricao, vagas, bolsa, processo_seletivo, perfil, contato
#
# Campos opcionais:
#   area, modalidade, carga_horaria, link_inscricao
#   ano_inicio, ano_fim (omitir ano_fim se projeto ainda ativo)

automacao-extensao:
  titulo: "Automação da Divulgação de Projetos de Extensão do IC"
  coordenador: "A definir"
  area: "Desenvolvimento de Software"
  modalidade: "Projeto"
  carga_horaria: 8
  descricao: >
    Desenvolvimento de um portal web integrado ao SIGA e de um sistema de notificações
    multicanal para automatizar a divulgação dos projetos de extensão do Instituto de
    Computação, eliminando retrabalho manual e ampliando o alcance junto à comunidade acadêmica.
  vagas: 4
  bolsa: false
  processo_seletivo: "Entrevista com os coordenadores"
  perfil: "Alunos de Ciência da Computação com interesse em desenvolvimento web, Hugo e automação de processos"
  contato: "extensao@ic.ufrj.br"
  ano_inicio: 2025

obi-polo-ic:
  titulo: "Olimpíada Brasileira de Informática — Polo IC"
  coordenador: "Hugo Nobrega"
  area: "Educação e Divulgação Científica"
  modalidade: "Projeto"
  carga_horaria: 4
  descricao: >
    O IC atua como polo de aplicação das provas e de preparação de alunos do ensino
    fundamental e médio para a Olimpíada Brasileira de Informática. Alunos de graduação
    podem participar como monitores e colaboradores na organização local das etapas.
  vagas: 5
  bolsa: false
  processo_seletivo: "Análise de currículo pelos coordenadores"
  perfil: "Alunos com interesse em competições de programação e ensino de algoritmos"
  contato: "obi@ic.ufrj.br"
  link_inscricao: "https://olimpiada.ic.unicamp.br/"
  ano_inicio: 2023

computacao-escolas:
  titulo: "Computação nas Escolas"
  coordenador: "Vivian dos Santos Silva"
  area: "Educação Básica"
  modalidade: "Projeto"
  carga_horaria: 6
  descricao: >
    Oficinas de introdução à computação e pensamento computacional para alunos e
    professores de escolas públicas do Rio de Janeiro, com foco em programação
    visual e robótica educacional.
  vagas: 4
  bolsa: true
  processo_seletivo: "Envio de currículo e carta de motivação para o e-mail de contato"
  perfil: "Alunos com interesse em educação e didática de computação para o ensino básico"
  contato: "computacao.escolas@ic.ufrj.br"
  ano_inicio: 2024

inclusao-digital:
  titulo: "Inclusão Digital para a Terceira Idade"
  coordenador: "Jonice Oliveira"
  area: "Inclusão Social e Digital"
  modalidade: "Projeto"
  carga_horaria: 4
  descricao: >
    Capacitação em tecnologias digitais — uso de smartphones, serviços governamentais
    online e segurança na internet — para idosos atendidos por organizações parceiras
    da UFRJ no Rio de Janeiro.
  vagas: 2
  bolsa: true
  processo_seletivo: "Entrevista com a coordenadora"
  perfil: "Alunos com habilidades de comunicação e interesse em ensino para a terceira idade"
  contato: "inclusao.digital@ic.ufrj.br"
  ano_inicio: 2024

tecnologia-ongs:
  titulo: "Tecnologia para ONGs"
  coordenador: "Giseli Rabello Lopes"
  area: "Desenvolvimento Tecnológico"
  modalidade: "Projeto"
  carga_horaria: 10
  descricao: >
    Consultoria e desenvolvimento de soluções tecnológicas para organizações sem fins
    lucrativos do Rio de Janeiro. Alunos atuam em equipes multidisciplinares para
    diagnosticar problemas e entregar sistemas ou automações de baixo custo.
  vagas: 6
  bolsa: true
  processo_seletivo: "Análise de portfólio e entrevista técnica"
  perfil: "Alunos com experiência em desenvolvimento de software, análise de dados ou design de sistemas"
  contato: "tech.ongs@ic.ufrj.br"
  ano_inicio: 2023

