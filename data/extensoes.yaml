semana-da-computacao-2026:
  titulo: "Semana da Computação 2026"
  coordenador: "Marcos Tomazzoli Leipnitz"
  area: "Tecnologia e Produção"
  modalidade: "Evento"
  carga_horaria: 280
  descricao: >
    A Semana da Computação UFRJ é um evento gratuito e aberto que reúne estudantes,
    docentes, profissionais e interessados para discutir tecnologia e seus impactos
